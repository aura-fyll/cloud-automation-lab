# cloud-automation-lab — Scheduled Tasks Workflow
#
# This workflow runs specific automation tasks on a predefined schedule.
# Separate from the main workflow to allow independent scheduling of tasks.
#
# To add a new scheduled task:
#   1. Add a new job below (or extend the schedule matrix)
#   2. Set the desired cron expression
#   3. Set the TASK_NAME environment variable

name: Scheduled Tasks

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"

  # Also allow manual trigger for testing
  workflow_dispatch:
    inputs:
      task:
        description: "Task to run (default: system_info)"
        required: false
        type: string
        default: "system_info"

# Default permissions — read-only
permissions:
  contents: read

jobs:
  scheduled-system-info:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run system info task
        run: python -m src.main --task system_info

  scheduled-public-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run public API task
        run: python -m src.main --task public_api